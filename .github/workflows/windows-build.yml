name: Windows build

on:
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "native/include/**"
      - "windows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows samples
        run: msbuild windows/GoDiceInterface.sln /m /p:Configuration=Release /p:Platform=x64
