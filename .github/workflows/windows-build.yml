name: Windows build

on:
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "native/include/**"
      - "windows/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows samples
        run: msbuild windows/GoDiceInterface.sln /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: godice-windows-x64
          path: |
            windows/x64/Release/GoDiceDll.dll
            windows/x64/Release/GoDiceConsoleApp.exe
